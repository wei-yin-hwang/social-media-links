name: Auto merge claude branch to main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge --no-ff ${{ github.ref_name }} -m "Auto merge ${{ github.ref_name }} to main"
          git push origin main
